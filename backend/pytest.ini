[pytest]
# Two sets (phase 4c+). The everyday run, `pytest -q tests`, leaves out the slow tests; `pytest -q tests --full`
# runs everything. A test is slow when it needs Docker (marked by itself, see tests/conftest.py), runs a real
# library, times a program, or runs a long accuracy or flow check (marked by hand with @pytest.mark.slow).
markers =
    slow: needs Docker, runs a real library, times a program, or is a long flow; left out unless --full is given
