# The type checker (development-only, phase 4c+). Run it through tools/typecheck.py, which compares with
# mypy-baseline.txt so only new problems fail. Lenient on purpose: the code has few type annotations.
[mypy]
python_version = 3.12
files = app, evidence, tools, ottolab
ignore_missing_imports = True
warn_unused_configs = True
show_error_codes = True
hide_error_context = True
no_color_output = True
no_error_summary = True
