name: Deploy static demo to GitHub Pages

# Builds a READ-ONLY static snapshot of the app (real seeded run, real fixture executions on the CI runner)
# and publishes it with GitHub Pages. The FastAPI backend is not hosted; see docs/SCOPE.md.
on:
  push:
    branches: [claude/isogeny-evidence-lab-mvp-sg3pva, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: cd backend && python -m pytest tests -q
      - name: Build static demo
        run: python scripts/build_static_site.py site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
