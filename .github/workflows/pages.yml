name: Deploy Evidence Lab to GitHub Pages

# Builds the Evidence Lab frontend skeleton (evidence-lab/, sample data only, no backend) and publishes it with
# GitHub Pages at https://isogeny-labs.github.io/prototype/. The earlier MVP static demo is still available as
# demo/iel-demo.html in the repository; its Pages workflow is in git history (before this commit).
on:
  push:
    branches: [claude/isogeny-evidence-lab-mvp-sg3pva, main]
    paths: ["evidence-lab/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evidence-lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: evidence-lab/package-lock.json
      - run: npm ci
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Build for local-base end-to-end tests
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (every route, all sample projects)
        run: npm run test:e2e
      - name: Build for GitHub Pages (base /prototype/)
        run: npm run build:pages
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: evidence-lab/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
