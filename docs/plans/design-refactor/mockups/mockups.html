<title>Evidence Lab: design refactor mockups (throwaway)</title>
<!--
  THROWAWAY MOCKUP for docs/plans/design-refactor.md. Not the app, not wired into it, and safe to delete.
  One file, no build step: open it in a browser. The bar at the top switches the screen, the look and the
  "Cryptanalysis proof" dropdown. The colours are the app's own (frontend/src/index.css): the same slate, sky,
  amber, violet and indigo scales, swapped end for end for the light look.
  Sentences are the app's own wherever the app has one (read from docs/screenshots/). Demo data throughout.
-->
<style>

  --sky-100:oklch(95.1% .026 236.824);--sky-200:oklch(90.1% .058 230.902);--sky-300:oklch(82.8% .111 230.318);
  --sky-400:oklch(74.6% .16 232.661);--sky-500:oklch(68.5% .169 237.323);
  --amber-100:oklch(96.2% .059 95.617);--amber-200:oklch(92.4% .12 95.746);--amber-400:oklch(82.8% .189 84.429);
  --amber-500:oklch(76.9% .188 70.08);
  --violet-200:oklch(89.4% .057 293.283);--violet-400:oklch(70.2% .183 293.541);

}
:root[data-theme="light"]{
  color-scheme:light;
  --slate-50:oklch(12.9% .042 264.695);--slate-100:oklch(20.8% .042 265.755);--slate-200:oklch(27.9% .041 260.031);
  --slate-300:oklch(37.2% .044 257.287);--slate-400:oklch(44.6% .043 257.281);--slate-500:oklch(55.4% .046 257.417);
  --slate-600:oklch(70.4% .04 256.788);--slate-700:oklch(86.9% .022 252.894);--slate-800:oklch(92.9% .013 255.508);
  --slate-900:oklch(96.8% .007 247.896);--slate-950:oklch(98.4% .003 247.858);
  --sky-100:oklch(39.1% .09 240.876);--sky-200:oklch(44.3% .11 240.79);--sky-300:oklch(50% .134 242.749);
  --sky-400:oklch(58.8% .158 241.966);--sky-500:oklch(68.5% .169 237.323);
  --amber-100:oklch(41.4% .112 45.904);--amber-200:oklch(47.3% .137 46.201);--amber-400:oklch(66.6% .179 58.318);
  --amber-500:oklch(76.9% .188 70.08);
  --violet-200:oklch(43.2% .232 292.759);--violet-400:oklch(54.1% .281 293.009);
  --indigo-200:oklch(39.8% .195 277.366);--indigo-300:oklch(45.7% .24 277.023);--indigo-400:oklch(51.1% .262 276.966);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--slate-950);color:var(--slate-200);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.mono,code,pre{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace}
a{color:var(--sky-300);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit}
.ic{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:12px;height:12px}
.muted{color:var(--slate-400)}
.faint{color:var(--slate-500)}
.strong{color:var(--slate-50);font-weight:600}
.small{font-size:13px}
.xs{font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}

/* ---- the switcher above the mockup (hidden in the screenshots) ---- */
.mockbar{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:8px 16px;background:var(--violet-400);color:#fff;font-size:12.5px}
.mockbar b{letter-spacing:.04em}
.mockbar button{border:1px solid rgba(255,255,255,.45);background:transparent;color:#fff;border-radius:6px;padding:3px 9px;cursor:pointer}
.mockbar button[aria-pressed="true"]{background:#fff;color:#3b1d8f;font-weight:600}
.mockbar .sep{opacity:.5}
body.shot .mockbar{display:none}

/* ---- shell ---- */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.sidebar{border-right:1px solid var(--slate-800);padding:14px 12px 20px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;color:var(--slate-50);font-size:15px;padding:2px 4px 10px}
.brand i{display:grid;place-items:center;width:24px;height:24px;border-radius:6px;background:var(--sky-500);color:var(--slate-950);font-style:normal;font-size:11px;font-weight:700}
.org{font-size:12px;color:var(--slate-400);padding:0 4px 4px}
.switch{display:flex;align-items:center;gap:8px;border:1px solid var(--slate-800);background:color-mix(in oklab,var(--slate-900) 60%,transparent);border-radius:8px;padding:7px 10px;color:var(--slate-100);font-weight:500}
.switch .grow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--slate-300);font-weight:500}
.nav .ic{color:var(--slate-400)}
.nav.on{background:var(--slate-800);color:var(--slate-50)}
.nav.on .ic{color:var(--sky-300)}
.nav .badge{margin-left:auto;min-width:20px;text-align:center;border-radius:999px;border:1px solid var(--slate-600);padding:0 6px;font-size:11.5px;font-weight:600;color:var(--slate-100);font-variant-numeric:tabular-nums}
.navsec{display:flex;align-items:center;gap:8px;margin:14px 0 4px;padding:0 10px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate-500);font-weight:600}
.navsec b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:999px;border:1px solid var(--slate-700);font-size:10px;color:var(--slate-400);font-weight:600}
.sidefoot{margin-top:auto;border-top:1px solid var(--slate-800);padding-top:10px}
.topbar{height:52px;display:flex;align-items:center;gap:12px;padding:0 32px;border-bottom:1px solid var(--slate-800)}
.crumbs{color:var(--slate-400)}
.crumbs b{color:var(--slate-50);font-weight:500}
.crumbs span{margin:0 6px;color:var(--slate-600)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
.page{padding:28px 32px 56px}

/* ---- chips, tags and marks: three levels, never the same weight ---- */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid;border-radius:999px;padding:1px 9px;font-weight:600;font-size:13px;white-space:nowrap}
.chip.sm{font-size:12px;padding:0 7px;gap:4px}
.chip .sym{font-family:ui-monospace,Menlo,monospace;font-size:.85em}
.chip.pass{border-color:color-mix(in oklab,var(--sky-400) 50%,transparent);background:color-mix(in oklab,var(--sky-400) 10%,transparent);color:var(--sky-100)}
.chip.fail{border-color:color-mix(in oklab,var(--amber-400) 60%,transparent);background:color-mix(in oklab,var(--amber-400) 15%,transparent);color:var(--amber-100)}
.chip.neutral{border-color:var(--slate-600);background:color-mix(in oklab,var(--slate-800) 60%,transparent);color:var(--slate-100)}
.chip.warn{border-style:dashed;border-color:var(--slate-500);background:var(--slate-900);color:var(--slate-100)}
.tag{display:inline-flex;align-items:center;gap:5px;border:1px solid;border-radius:999px;padding:3px 8px 3px 6px;font-size:11.5px;font-weight:500;line-height:1;white-space:nowrap}
.tag.live{border-color:color-mix(in oklab,var(--sky-400) 60%,transparent);background:color-mix(in oklab,var(--sky-400) 10%,transparent);color:var(--sky-200)}
.tag.lab{border-color:color-mix(in oklab,var(--indigo-400) 60%,transparent);background:color-mix(in oklab,var(--indigo-400) 10%,transparent);color:var(--indigo-200)}
.tag.file{border-style:dashed;border-color:var(--slate-500);color:var(--slate-300)}
.tag.published{border-color:var(--slate-500);background:color-mix(in oklab,var(--slate-500) 10%,transparent);color:var(--slate-300)}
.mark{display:inline-flex;align-items:center;border:1px solid var(--slate-500);background:color-mix(in oklab,var(--slate-700) 40%,transparent);border-radius:4px;padding:1px 6px;font-size:11.5px;font-weight:500;color:var(--slate-100);white-space:nowrap;vertical-align:middle}
.mark.demo{border-color:color-mix(in oklab,var(--violet-400) 50%,transparent);background:color-mix(in oklab,var(--violet-400) 10%,transparent);color:var(--violet-200)}
.mark.new{border-color:color-mix(in oklab,var(--sky-400) 55%,transparent);background:transparent;color:var(--sky-200)}
.mark.sandbox{border-color:color-mix(in oklab,var(--amber-500) 50%,transparent);background:color-mix(in oklab,var(--amber-500) 10%,transparent);color:var(--amber-200)}
.mark.mock{border-style:dashed;border-color:var(--violet-400);background:transparent;color:var(--violet-200);letter-spacing:.06em;text-transform:uppercase;font-size:10.5px}
.mini{display:inline-block;border:1px solid var(--slate-700);border-radius:4px;padding:0 5px;font-size:11px;color:var(--slate-400);line-height:1.5;white-space:nowrap}

/* ---- buttons ---- */
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--slate-700);background:var(--slate-900);color:var(--slate-100);border-radius:8px;padding:7px 13px;font-weight:500;white-space:nowrap;cursor:pointer}
.btn.primary{border-color:transparent;background:var(--sky-500);color:var(--slate-950);font-weight:600}
:root[data-theme="light"] .btn.primary{color:#fff}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
.btn.ghost{background:transparent;border-color:var(--slate-800);color:var(--slate-300)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.icon{padding:5px}

/* ---- page header, cards, tabs ---- */
.pagehead{display:flex;align-items:flex-end;gap:24px;padding-bottom:20px;border-bottom:1px solid var(--slate-800);margin-bottom:20px}
.pagehead h1{font-size:24px;line-height:1.2;color:var(--slate-50);font-weight:600;letter-spacing:-.01em}
.pagehead h1 .mark{position:relative;top:-3px;margin-left:4px}
.pagehead p{margin-top:6px;color:var(--slate-400);max-width:68ch}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;flex:none}
.tabs{display:inline-flex;gap:2px;border:1px solid var(--slate-800);background:color-mix(in oklab,var(--slate-900) 60%,transparent);border-radius:10px;padding:4px}
.tab{display:flex;align-items:center;gap:8px;border:0;background:transparent;border-radius:7px;padding:6px 12px;font-weight:500;color:var(--slate-400);white-space:nowrap;cursor:pointer}
.tab.on{background:var(--slate-800);color:var(--slate-50)}
.tab .n{font-size:12px;font-variant-numeric:tabular-nums;color:var(--slate-400);border:1px solid var(--slate-700);border-radius:999px;padding:0 6px;line-height:1.5}
.tab .find{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--amber-200)}
.band{display:flex;align-items:stretch;gap:0;border:1px solid var(--slate-800);border-radius:12px;background:color-mix(in oklab,var(--slate-900) 50%,transparent);margin:14px 0 16px}
.band .q{flex:1;min-width:0;padding:14px 18px}
.band .q h2{font-size:15px;color:var(--slate-50);font-weight:600}
.band .q p{font-size:13px;color:var(--slate-400);margin-top:2px}
.band .stat{padding:12px 20px;border-left:1px solid var(--slate-800);min-width:104px}
.band .stat dt{font-size:12px;color:var(--slate-400)}
.band .stat dd{font-size:22px;line-height:1.2;font-weight:600;color:var(--slate-50);font-variant-numeric:tabular-nums}
.band .stat small{font-size:11.5px;color:var(--slate-500)}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--slate-700);background:var(--slate-900);border-radius:8px;padding:7px 11px;color:var(--slate-500);width:300px}
.select{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--slate-700);background:var(--slate-900);border-radius:8px;padding:7px 11px;color:var(--slate-100)}
.toolbar label{color:var(--slate-400);font-size:13px}
.toolbar .legend{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--slate-400)}
.standing{margin-top:14px;font-size:12.5px;color:var(--slate-400)}

/* ---- tables ---- */
.table{width:100%;border-collapse:separate;border-spacing:0;border:1px solid var(--slate-800);border-radius:12px;overflow:hidden;background:color-mix(in oklab,var(--slate-900) 45%,transparent)}
.table th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-400);font-weight:500;text-align:left;padding:10px 16px;border-bottom:1px solid var(--slate-800);white-space:nowrap}
.table td{padding:13px 16px;border-bottom:1px solid var(--slate-800);vertical-align:top}
.table tr:last-child td{border-bottom:0}
.table tr.sel td{background:color-mix(in oklab,var(--sky-400) 8%,transparent)}
.table tr.sel td:first-child{box-shadow:inset 2px 0 0 var(--sky-400)}
.table .name{color:var(--slate-50);font-weight:500}
.table .on{font-size:12.5px;color:var(--slate-400);white-space:nowrap}
.table .plain{font-size:13px;color:var(--slate-300);margin-top:3px;max-width:58ch}
.table .when{font-size:12.5px;color:var(--slate-400);white-space:nowrap}
.table .fix{font-size:13px;color:var(--slate-300)}
.table tr.sub td{padding:8px 16px;background:color-mix(in oklab,var(--slate-800) 35%,transparent);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--slate-400);font-weight:600}
.table tr.sub td .mark{text-transform:none;letter-spacing:0;margin-left:6px}
.table.ev th:nth-child(1){width:52%}.table.ev th:nth-child(2){width:11%}.table.ev th:nth-child(3){width:23%}
.table.compact td{padding:11px 14px}
.table.compact td:last-child{width:1%;white-space:nowrap}
.cell-stack{display:flex;flex-direction:column;align-items:flex-start;gap:6px}
.grip{color:var(--slate-600);width:14px}
.why{margin-top:6px;font-size:12.5px;color:var(--slate-400);border-left:2px solid var(--slate-700);padding-left:10px;max-width:60ch}
.fold{display:flex;align-items:center;gap:10px;border:1px solid var(--slate-800);border-radius:10px;padding:10px 14px;margin-top:10px;color:var(--slate-300);background:color-mix(in oklab,var(--slate-900) 35%,transparent)}
.fold b{color:var(--slate-100);font-weight:600}
.fold .n{font-size:12px;border:1px solid var(--slate-700);border-radius:999px;padding:0 7px;color:var(--slate-400)}
.fold .end{margin-left:auto}

/* ---- the split: compact table and the side panel ---- */
.split{display:grid;grid-template-columns:minmax(300px,33%) minmax(0,1fr);gap:20px;align-items:start}
.panel{border:1px solid var(--slate-800);border-radius:14px;background:color-mix(in oklab,var(--slate-900) 40%,transparent);min-width:0}
.phead{padding:12px 20px 16px;border-bottom:1px solid var(--slate-800)}
.ptools{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.ptools .where{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate-500);font-weight:600;margin-right:auto}
.phead h2{font-size:18px;line-height:1.3;color:var(--slate-50);font-weight:600}
.phead .sub{margin-top:4px;font-size:13px;color:var(--slate-400)}
.pbody{padding:18px 20px 22px;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate-500);font-weight:600;margin-bottom:8px}

/* ---- the trail: where this item sits ---- */
.trail{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:0;border:1px solid var(--slate-800);border-radius:10px;overflow:hidden}
.trail li{position:relative;padding:8px 12px 9px 18px;border-left:1px solid var(--slate-800);min-width:0}
.trail li:first-child{border-left:0;padding-left:12px}
.trail li:not(:first-child)::before{content:"";position:absolute;left:-5px;top:50%;width:8px;height:8px;border-top:1px solid var(--slate-600);border-right:1px solid var(--slate-600);background:var(--slate-950);transform:translateY(-50%) rotate(45deg)}
.trail .k{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--slate-500);font-weight:600}
.trail .v{display:block;font-size:12.5px;color:var(--slate-200);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trail .s{display:block;font-size:11.5px;color:var(--slate-400)}
.trail li.here{background:color-mix(in oklab,var(--sky-400) 9%,transparent)}
.trail li.here .k{color:var(--sky-300)}
.trail li.here .v{color:var(--slate-50);font-weight:600}

/* ---- layer 1: at a glance ---- */
.glance{border:1px solid var(--slate-700);border-radius:12px;background:var(--slate-900);padding:16px 18px}
.glance .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.glance .top .when{margin-left:auto;font-size:12.5px;color:var(--slate-400)}
.glance .lead{font-size:16px;line-height:1.45;color:var(--slate-50);font-weight:500;margin:12px 0 12px;max-width:64ch}
.facts{display:grid;gap:6px;font-size:13px;color:var(--slate-300)}
.facts li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px;align-items:start}
.facts .ic{margin-top:2px;color:var(--slate-400)}
.next{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--slate-800)}
.next .say{font-size:13.5px;color:var(--slate-200)}
.next .say b{color:var(--slate-50)}
.next .end{margin-left:auto;display:flex;gap:8px}
.why-line{font-size:14px;color:var(--slate-200);margin-top:10px;max-width:66ch}
.why-line .faint{font-size:12px}

/* ---- layer 2: what this shows, and what it doesn't ---- */
.shows{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--slate-800);border-radius:12px}
.shows>div{padding:12px 16px}
.shows>div+div{border-left:1px solid var(--slate-800)}
.shows h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--slate-400);font-weight:600;margin-bottom:4px}
.shows p{font-size:13.5px;color:var(--slate-200)}
.shows .foot{grid-column:1/-1;border-left:0;border-top:1px solid var(--slate-800);font-size:12.5px;color:var(--slate-400);padding:8px 16px}

/* ---- layer 3: the Cryptanalysis proof dropdown ---- */
details.proof{border:1px solid var(--slate-700);border-radius:12px;background:var(--slate-950)}
details.proof>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
details.proof>summary::-webkit-details-marker{display:none}
details.proof>summary .chev{color:var(--slate-400);transition:transform .15s}
details.proof[open]>summary .chev{transform:rotate(90deg)}
details.proof>summary .badge{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--slate-700);background:var(--slate-900);color:var(--slate-300)}
details.proof>summary .t{font-size:14.5px;font-weight:600;color:var(--slate-50)}
details.proof>summary .d{font-size:12.5px;color:var(--slate-400)}
details.proof>summary .act{margin-left:auto;font-size:12.5px;color:var(--sky-300);font-weight:500;white-space:nowrap}
details.proof[open]>summary .act .show,details.proof:not([open])>summary .act .hide{display:none}
.pbodyx{border-top:1px solid var(--slate-800);padding:0 18px 6px}
.jump{display:flex;flex-wrap:wrap;gap:6px;padding:12px 0 2px}
.jump a{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--slate-800);border-radius:999px;padding:2px 10px 2px 3px;font-size:12px;color:var(--slate-300)}
.jump a b,.psec h4 .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:999px;border:1px solid var(--slate-600);font-size:10.5px;color:var(--slate-300);font-weight:600}
.psec{padding:16px 0;border-top:1px solid var(--slate-800)}

const ic = (id) => `<svg class="ic"><use href="#i-${id}"/></svg>`;

// One tab strip for Checks, Evidence and Fixes: the same four groups, the same order, a count on each,

function tabs(active, page) {
  const groups =

  return `<div class="tabs" role="tablist" aria-label="Work groups">${groups
    .map(

        `<button class="tab${key === active ? " on" : ""}" role="tab" aria-selected="${key === active}">${label}<span class="n">${n}</span>${find ? `<span class="find">✕ ${find}</span>` : ""}</button>`,
    )
    .join("")}</div>`;
}
// Draws a map's lines from its data-edges: a curve from the bottom of one box to the top of another, or a straight
// dashed line between two boxes side by side. Positions are layout positions, so a scaled copy draws the same.
function where(el, root) {
  let x = 0, y = 0, n = el;
  while (n && n !== root) { x += n.offsetLeft; y += n.offsetTop; n = n.offsetParent; }
  return { x, y, w: el.offsetWidth, h: el.offsetHeight };
}
function drawEdges(map) {
  const svg = map.querySelector("svg.edges");
  map.querySelectorAll(".elabel").forEach((e) => e.remove());
  const W = map.offsetWidth, H = map.offsetHeight;
  svg.setAttribute("width", W); svg.setAttribute("height", H); svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  svg.innerHTML = '<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--sky-400)"/></marker></defs>';
  for (const e of JSON.parse(map.dataset.edges || "[]")) {
    const A = map.querySelector(`[data-k="${e.a}"]`), B = map.querySelector(`[data-k="${e.b}"]`);
    if (!A || !B) continue;
    const a = where(A, map), b = where(B, map);
    let d, lx, ly;
    if (e.dir === "h") {
      const y = a.y + Math.min(a.h, b.h) / 2, x1 = a.x + a.w, x2 = b.x;
      d = `M${x1} ${y}L${x2} ${y}`; lx = (x1 + x2) / 2; ly = y;
    } else {
      const x1 = a.x + a.w * (e.xa ?? 0.5), y1 = a.y + a.h, x2 = b.x + b.w * (e.xb ?? 0.5), y2 = b.y - (e.kind === "live" ? 2 : 0);
      const m = (y2 - y1) / 2;
      d = `M${x1} ${y1}C${x1} ${y1 + m} ${x2} ${y2 - m} ${x2} ${y2}`;
      const t = e.t ?? 0.5, u = 1 - t;
      lx = u * u * u * x1 + 3 * u * u * t * x1 + 3 * u * t * t * x2 + t * t * t * x2;
      ly = u * u * u * y1 + 3 * u * u * t * (y1 + m) + 3 * u * t * t * (y2 - m) + t * t * t * y2;
    }
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", d); path.setAttribute("class", e.kind);
    if (e.kind === "live") path.setAttribute("marker-end", "url(#arr)");
    svg.appendChild(path);
    if (e.label) {
      const l = document.createElement("span");
      l.className = "elabel " + e.kind; l.innerHTML = e.label;
      l.style.left = lx + "px"; l.style.top = ly + "px";
      map.appendChild(l);
    }
  }
}
const state = { screen: "evidence", theme: "dark", proof: "closed" };

  const page = document.getElementById("page");

  page.querySelectorAll("details[data-proof]").forEach((d) => (d.open = state.proof === "open"));

    slot.replaceChildren(document.getElementById("t-map-" + slot.dataset.map).content.cloneNode(true));
    if (slot.dataset.sel) slot.querySelector(`[data-k="${slot.dataset.sel}"]`)?.classList.add("sel");
  });
  page.querySelectorAll("[data-map-thumb]").forEach((slot) => {
    slot.replaceChildren(document.getElementById("t-map-" + slot.dataset.mapThumb).content.cloneNode(true));
    const map = slot.querySelector(".map");
    map.style.width = "1064px";
  });
  page.querySelectorAll(".map").forEach(drawEdges);
  page.querySelectorAll("[data-map-thumb]").forEach((slot) => {
    const map = slot.querySelector(".map");
    const k = (slot.clientWidth - 20) / map.offsetWidth;
    map.style.transform = `scale(${k})`;
    slot.style.height = Math.ceil(map.offsetHeight * k + 20) + "px";
  });
  page.querySelectorAll(".drawer").forEach((d) => {
    const card = d.closest(".mapcard");
    card.style.minHeight = d.offsetTop + d.offsetHeight + 14 + "px";
  });
  document.querySelectorAll("#mockbar button").forEach((b) => {
    const on = b.dataset.screen === state.screen || b.dataset.themeSet === state.theme || b.dataset.proof === state.proof;
    b.setAttribute("aria-pressed", String(on));
  });
}
document.getElementById("mockbar").addEventListener("click", (e) => {
  const b = e.target.closest("button");

  if (b.dataset.themeSet) state.theme = b.dataset.themeSet;
  if (b.dataset.proof) state.proof = b.dataset.proof;
  render();
});

const q = new URLSearchParams(location.search);
for (const k of ["screen", "theme", "proof"]) if (q.get(k)) state[k] = q.get(k);
